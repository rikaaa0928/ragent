[package]
name = "ragent"
version = "0.1.0"
edition = "2021"

[dependencies]
openresponses-rust = "2026.7.26"
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
wasmtime = { version = "37", features = ["component-model", "async"] }
wasmtime-wasi = "37"
toml = "0.8"
dirs = "5.0"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1.0", features = ["v7", "v4", "serde"] }
fs2 = "0.4"

[features]
default = []
test-utils = []

[dev-dependencies]
tempfile = "3.27.0"
